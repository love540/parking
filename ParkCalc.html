<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>주차 할인권 계산기</title>
<style>
  :root{
    --bg:#f7f7f9; --card:#ffffff; --text:#222; --muted:#6b7280;
    --brand:#2563eb; --brand-press:#1d4ed8; --border:#e5e7eb;
    --shadow:0 6px 20px rgba(0,0,0,.06); --radius:14px;
  }
  body{background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,Apple SD Gothic Neo,Noto Sans KR,sans-serif;margin:0}
  .wrap{max-width:640px;margin:0 auto;padding:18px}
  .card{background:var(--card);box-shadow:var(--shadow);border-radius:var(--radius);padding:18px 16px;margin:12px 0}
  h1{font-size:1.25rem;margin:10px 0 6px}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 10px}
  .row{display:flex;align-items:center;gap:10px;margin:12px 0}
  .col{flex:1; display:flex; align-items:center; gap:8px}
  input{flex:1; width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:12px;padding:12px;font-size:1.05rem}
  input::placeholder{color:#9ca3af}
  .unit{min-width:32px;text-align:center;font-size:1rem}
  .btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:1.06rem;background:var(--brand);color:#fff}
  .btn:disabled{opacity:.4}
  .btn:active{background:var(--brand-press)}
  .btn-secondary{background:#111827;color:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
  .stat{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fcfcfd;text-align:center}
  .stat .k{font-size:.88rem;color:var(--muted)}
  .stat .v{font-size:1.6rem;font-weight:800;margin-top:4px}
  .badge{display:inline-flex;align-items:center;gap:6px;background:#eef2ff;color:#3730a3;border-radius:999px;padding:6px 10px;font-size:.9rem;font-weight:700}
  .footer{font-size:.82rem;color:var(--muted);text-align:center;margin-top:10px}
  .hidden{display:none}
  button,input{min-height:48px}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{ -webkit-appearance: none; margin: 0; }
  @media (max-width:420px){ .grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>주차 할인권 계산기</h1>
      <p class="sub">방문권 1개(90분 무료) + 할인권 1개(30분, 최대 5개)</p>

      <div class="row">
        <span class="badge">방문권: <strong>1개</strong> / 90분 무료</span>
      </div>

      <!-- 시간/분 입력: 옆에만 단위 표기, placeholder로 0시 00분 -->
      <div class="row" aria-label="주차시간 입력">
        <div class="col">
          <input id="hours" type="number" min="0" max="5" inputmode="numeric"
                 placeholder="0시" aria-label="시간(0~5)" />
          <span class="unit" aria-hidden="true">시간</span>
        </div>
        <div class="col">
          <input id="mins" type="number" min="0" max="59" inputmode="numeric"
                 placeholder="00분" aria-label="분(0~59)" />
          <span class="unit" aria-hidden="true">분</span>
        </div>
      </div>

      <div class="row">
        <button id="calcBtn" class="btn" disabled>계산하기</button>
      </div>

      <!-- 결과 -->
      <div id="resultCard" class="card hidden" role="region" aria-live="polite" aria-label="계산 결과">
        <div class="grid">
          <div class="stat">
            <div class="k">사용 할인권 개수 (최대 5개)</div>
            <div id="tickets" class="v">0</div>
          </div>
          <div id="remainStat" class="stat">
            <div class="k">남은 시간(분)</div>
            <div id="remaining" class="v">0</div>
          </div>
          <div id="feeStat" class="stat hidden">
            <div class="k">초과 주차 요금(원)</div>
            <div id="overFee" class="v">0</div>
          </div>
        </div>
        <div class="sub" id="detailLine" style="margin-top:10px"></div>
        <div class="row" style="margin-top:14px">
          <button id="resetBtn" class="btn btn-secondary">리셋</button>
        </div>
      </div>

      <p class="footer">
        방문권 90분 + 할인권(각 30분, 최대 5개) 적용 후 남으면 “남은 시간”으로 표시,<br/>
        모자라면 초과 시간에 대해 <strong>15분당 1,000원</strong>으로 “초과 주차 요금” 표시.
      </p>
    </div>
  </div>

<script>
  const hoursInput = document.getElementById('hours');
  const minsInput = document.getElementById('mins');
  const calcBtn = document.getElementById('calcBtn');
  const resultCard = document.getElementById('resultCard');

  const ticketsEl = document.getElementById('tickets');
  const remainingEl = document.getElementById('remaining');
  const overFeeEl = document.getElementById('overFee');

  const remainStat = document.getElementById('remainStat');
  const feeStat = document.getElementById('feeStat');

  const resetBtn = document.getElementById('resetBtn');
  const detailLine = document.getElementById('detailLine');

  // 새로운 규칙
  const VISIT_PASS_MINUTES = 90;   // 방문권 1개
  const TICKET_MINUTES = 30;       // 할인권 1개
  const MAX_TICKETS = 5;           // 할인권 최대 개수
  const OVER_FEE_UNIT_MIN = 15;    // 15분당
  const OVER_FEE_PER_UNIT = 1000;  // 1,000원

  // placeholder만 보이게(0시 00분처럼 보이고 탭하면 사라짐)
  hoursInput.value = '';
  minsInput.value = '';

  function getTotalMinutes() {
    const h = Number(hoursInput.value) || 0;
    const m = Number(minsInput.value) || 0;
    return h * 60 + m;
  }

  function validate() {
    const hStr = hoursInput.value, mStr = minsInput.value;
    if (hStr === '' || mStr === '') return false;
    const h = Number(hStr), m = Number(mStr);
    return Number.isInteger(h) && h >= 0 && h <= 5 &&
           Number.isInteger(m) && m >= 0 && m <= 59;
  }

  function updateButton() {
    calcBtn.disabled = !validate();
  }

  function clampInputs(e) {
    const el = e.target;
    if (el.id === 'hours') {
      if (el.value === '') return updateButton();
      let v = Math.max(0, Math.min(5, Number(el.value)));
      el.value = String(v);
    } else if (el.id === 'mins') {
      if (el.value === '') return updateButton();
      let v = Math.max(0, Math.min(59, Number(el.value)));
      el.value = String(v);
    }
    updateButton();
  }

  hoursInput.addEventListener('input', clampInputs);
  minsInput.addEventListener('input', clampInputs);

  calcBtn.addEventListener('click', () => {
    const total = getTotalMinutes();

    // 방문권 적용 후 남은 유료분
    const afterVisit = Math.max(0, total - VISIT_PASS_MINUTES);

    // 필요한 할인권 개수(요금을 0으로 만들 수 있도록) 계산하되, 최대 5개 제한 적용
    const neededTickets = afterVisit === 0 ? 0 : Math.ceil(afterVisit / TICKET_MINUTES);
    const usedTickets = Math.min(neededTickets, MAX_TICKETS);

    // 총 무료 시간
    const freeTotal = VISIT_PASS_MINUTES + usedTickets * TICKET_MINUTES;

    // 남는 무료시간 / 초과 시간
    const remaining = Math.max(0, freeTotal - total);         // 무료가 남는 경우
    const overMinutes = Math.max(0, total - freeTotal);       // 무료가 부족한 경우

    // 초과 요금: 초과시간이 1분이라도 있으면 15분 단위 올림 청구
    const overFee = overMinutes > 0 ? Math.ceil(overMinutes / OVER_FEE_UNIT_MIN) * OVER_FEE_PER_UNIT : 0;

    // 표시
    ticketsEl.textContent = String(usedTickets);
    // 남는 경우: 남은 시간 카드 ON, 요금 카드 OFF
    if (overMinutes === 0) {
      remainingEl.textContent = String(remaining);
      remainStat.classList.remove('hidden');
      feeStat.classList.add('hidden');
    } else {
      // 초과인 경우: 남은 시간 카드 OFF, 요금 카드 ON
      overFeeEl.textContent = overFee.toLocaleString('ko-KR');
      feeStat.classList.remove('hidden');
      remainStat.classList.add('hidden');
    }

    // 안내 문구(상세)
    const capNote = neededTickets > MAX_TICKETS
      ? `필요 할인권은 ${neededTickets}개였으나, 최대 ${MAX_TICKETS}개까지만 적용됨. `
      : '';
    const tail = overMinutes === 0
      ? `남은 시간: ${remaining}분`
      : `초과 시간: ${overMinutes}분 → 초과 요금: ${overFee.toLocaleString('ko-KR')}원 (15분당 1,000원)`;

    detailLine.textContent =
      `총 ${total}분 → 방문권 ${VISIT_PASS_MINUTES}분 적용 후 ${afterVisit}분 → ` +
      `할인권 ${usedTickets}개 사용(총 무료 ${freeTotal}분). ` +
      capNote + tail;

    resultCard.classList.remove('hidden');
  });

  resetBtn.addEventListener('click', () => {
    hoursInput.value = '';
    minsInput.value = '';
    calcBtn.disabled = true;
    resultCard.classList.add('hidden');
    ticketsEl.textContent = '0';
    remainingEl.textContent = '0';
    overFeeEl.textContent = '0';
    detailLine.textContent = '';
    hoursInput.focus();
  });

  updateButton();
</script>
</body>
</html>
